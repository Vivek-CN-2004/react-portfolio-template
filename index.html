<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Portfolio Template | Full-Stack Developer & Software Engineer</title>
    <meta
      name="description"
      content="A modern, dark-themed React + Vite portfolio template built with Tailwind CSS, Framer Motion, and interactive animations."
    />
    <meta name="author" content="Your Name" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="canonical" href="https://yourportfolio.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Developer Portfolio Template" />
    <meta
      property="og:description"
      content="A modern, dark-themed React + Vite portfolio template built with Tailwind CSS, Framer Motion, and interactive animations."
    />
    <meta property="og:url" content="https://yourportfolio.com/" />
    <meta property="og:image" content="https://yourportfolio.com/og-image.png" />
    <meta property="og:site_name" content="Developer Portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Developer Portfolio Template" />
    <meta
      name="twitter:description"
      content="A modern, dark-themed React + Vite portfolio template built with Tailwind CSS, Framer Motion, and interactive animations."
    />
    <meta name="twitter:image" content="https://yourportfolio.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Your Name",
        "jobTitle": "Full Stack Developer",
        "url": "https://yourportfolio.com/",
        "sameAs": [
          "https://github.com/yourusername",
          "https://linkedin.com/in/yourusername"
        ]
      }
    </script>
  </head>
  <body class="bg-background text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
